# Agent and judge run settings. Model NAMES are not here: they come from the
# environment (ANTHROPIC_MODEL for the agent, JUDGE_MODEL for the judge).
[agent]
effort = "medium"
max_tokens = 16000
max_retries = 4
concurrency = 4

[judge]
effort = "medium"
max_tokens = 8000

# V1: the model only reads text (issuer note, support messages) and writes letters.
[v1_reader]
effort = "low"
max_tokens = 4000

[v1_writer]
effort = "medium"
max_tokens = 8000
